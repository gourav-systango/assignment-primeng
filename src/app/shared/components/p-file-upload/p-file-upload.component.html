<div class="card">
  <p-toast />
  <p-fileupload
    #fileUploader
    name="myfile[]"
    [url]="uploadUrl"
    [multiple]="multipleUpload"
    [accept]="acceptFile"
    [customUpload]="false"
    [maxFileSize]="maxFileSize"
    [disabled]="isDisabled"
    [method]="method"
    (onUpload)="onTemplatedUpload($event)"
    (onSelect)="onSelect($event)"
    (onBeforeUpload)="onBeforeUpload($event)"
    (onError)="onError($event)" 
  >
    <ng-template #header let-files
      let-chooseCallback="chooseCallback"
      let-clearCallback="clearCallback"
      let-uploadCallback="uploadCallback"
    >
      <div class="flex flex-wrap justify-between items-center flex-1 gap-4">
        <div class="flex gap-2">
          <p-button
            (onClick)="choose($event, chooseCallback)"
            icon="pi pi-images"
            [rounded]="true"
            [outlined]="true"
            [disabled]="isDisabled"
          />
          <p-button
            (click)="uploadEvent(uploadCallback)"
            icon="pi pi-cloud-upload"
            [rounded]="true"
            [outlined]="true"
            severity="success"
            [disabled]="!files || files.length === 0"
          />
          <p-button 
            (click)="manageImageCroper(); clearCallback();"
            icon="pi pi-times"
            [rounded]="true"
            [outlined]="true"
            severity="danger"
            [disabled]="!files || files.length === 0"
          />

          <p-button icon="pi pi-download"
            (click)="downloadImage(file)"
            [outlined]="true"
            [rounded]="true"
            severity="info"
            [disabled]="!files || files.length === 0"
          ></p-button>
        </div>
      </div>
    </ng-template>
    <ng-template #content let-files
      let-uploadedFiles="uploadedFiles"
      let-removeFileCallback="removeFileCallback"
      let-removeUploadedFileCallback="removeUploadedFileCallback"
    >
      <div class="flex flex-col gap-8 pt-4">
        <div *ngIf="files?.length > 0">
          <h5>Pending</h5>
          <div class="flex flex-col gap-4">
            <div *ngFor="let file of files; index as i"
              class="p-4 flex items-center justify-between border border-surface rounded-lg">
              
              <div class="flex items-center gap-4">
                <img role="presentation"
                  [alt]="file.name"
                  [src]="file.objectURL"
                  class="w-16 h-12 rounded"
                />
                <div class="flex flex-col">
                  <span class="font-semibold text-ellipsis max-w-60 whitespace-nowrap overflow-hidden">
                    {{ file.name }}
                  </span>
                  <div class="text-sm text-gray-500">{{ formatSize(file.size) }}</div>
                </div>
              </div>
          
              <div class="flex gap-2">
                <label class="text-sm text-gray-500 mt-2">Set Profile:</label>
                <p-toggleswitch class="mt-2" (click)="isCropEnabled = !isCropEnabled; freeTransform = false" [dt]="amberSwitch"/> 
                <p-badge value="Pending" class="mt-2 mr-4" severity="warn" />
                <p-button icon="pi pi-download"
                  (click)="downloadImage(file)"
                  [outlined]="true"
                  [rounded]="true"
                  severity="info"
                />
                <p-button icon="pi pi-times"
                  (click)="onRemoveTemplatingFile($event, file, removeFileCallback, i)"
                  [outlined]="true"
                  [rounded]="true"
                  severity="danger"
                />
              </div>
            </div>
          </div>
        </div>
        <div *ngIf="uploadedFiles?.length > 0">
          <h5>Completed</h5>
          <div class="flex flex-col gap-4">
            <div *ngFor="let file of uploadedFiles; index as i"
              class="p-4 flex items-center justify-between border border-surface rounded-lg">
              <div class="flex items-center gap-4">
                <img role="presentation"
                  [alt]="file.name"
                  [src]="file.objectURL"
                  class="w-16 h-12 rounded"
                />
                <div class="flex flex-col">
                  <span class="font-semibold text-ellipsis max-w-60 whitespace-nowrap overflow-hidden">
                    {{ file.name }}
                  </span>
                  <div class="text-sm text-gray-500">{{ formatSize(file.size) }}</div>
                </div>
              </div>
          
              <div class="flex gap-2">
                <label class="text-sm text-gray-500 mt-2">Set Profile:</label>
                <p-toggleswitch class="mt-2" (click)="isCropEnabled = !isCropEnabled; freeTransform = false" [dt]="amberSwitch"/> 
                <p-badge value="Completed" class="mt-2 mr-4" severity="success" />
                <p-button icon="pi pi-download"
                  (click)="downloadImage(file)"
                  [outlined]="true"
                  [rounded]="true"
                  severity="info"
                />
                <p-button icon="pi pi-times"
                  (click)="removeUploadedFileCallback(i)"
                  [outlined]="true"
                  [rounded]="true"
                  severity="danger"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
    <ng-template #file></ng-template>
    <ng-template #empty>
      <div class="flex items-center justify-center flex-col">
        <i class="pi pi-cloud-upload !border-2 !rounded-full !p-8 !text-4xl" [class]="isDisabled ? 'text-muted-color' : '!text-muted-color' " ></i>
        <p class="mt-6 mb-0" [class]="isDisabled ? 'text-muted-color' : '!text-muted-color' ">Drag and drop files to here to upload.</p>
      </div>
    </ng-template>
  </p-fileupload>
</div>
  
  
<div class="card" *ngIf="isCropEnabled && imageFile">
  <image-cropper
    [imageFile]="imageFile"
    [maintainAspectRatio]="!freeTransform"
    [aspectRatio]="selectedRatio"
    [format]="selectedFormat"
    (imageCropped)="imageCropped($event)"
  ></image-cropper>

  <div *ngIf="croppedImage">
    <h4>Preview</h4>
    <img [src]="croppedImage" [alt]="'Preview Cropped Image'" class="w-16" />
  </div>

  <div class="controls">
    <label>Free Transfrom:</label>
    <p-toggleswitch class="mt-2" (click)="freeTransform = !freeTransform" [dt]="amberSwitch"/> 

    <label>Aspect Ratio:</label>
    <p-select
      [options]="aspectRatios"
      (onChange)="changeAspectRatio($event.value)"
    ></p-select>

    <label>Format:</label>
    <p-select
      [options]="supportedFormats"
      (onChange)="changeFormat($event.value)"
    ></p-select>
  </div>
</div>
